<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f766e">
<title>ふくろく訪問看護 料金シミュレーター</title>
<link rel="icon" type="image/svg+xml" href="r8/icon.svg">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; padding: 32px 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    background: #f1f5f9; color: #0f172a;
    display: flex; align-items: center; justify-content: center;
  }
  main { width: 100%; max-width: 440px; }
  h1 { font-size: 20px; margin: 0 0 20px; text-align: center; line-height: 1.5; }
  a.card {
    display: block; padding: 20px; margin-bottom: 12px; border-radius: 12px;
    background: #fff; border: 1px solid #cbd5e1; color: inherit; text-decoration: none;
  }
  a.card.main { background: #0f766e; border-color: #0f766e; color: #fff; }
  a.card strong { display: block; font-size: 17px; margin-bottom: 4px; }
  a.card span { font-size: 13px; opacity: .85; }
  a.card:focus-visible { outline: 3px solid #0369a1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>ふくろく訪問看護<br>料金シミュレーター</h1>
  <a class="card main" href="r8/">
    <strong>令和8年度版</strong>
    <span>現在の料金で計算します</span>
  </a>
  <a class="card" href="r6/">
    <strong>令和6年度版（以前の料金）</strong>
    <span>改定前の料金で計算します</span>
  </a>
</main>
</body>
</html>
